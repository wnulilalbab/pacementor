<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="fig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="88" fill="url(#bg)"/>

  <!-- Subtle ground line -->
  <line x1="56" y1="458" x2="456" y2="458" stroke="#f97316" stroke-width="5" stroke-linecap="round" opacity="0.18"/>

  <!-- Speed / motion lines (left side) -->
  <line x1="44"  y1="182" x2="148" y2="182" stroke="#f97316" stroke-width="8"  stroke-linecap="round" opacity="0.55"/>
  <line x1="32"  y1="224" x2="136" y2="224" stroke="#f97316" stroke-width="8"  stroke-linecap="round" opacity="0.35"/>
  <line x1="44"  y1="266" x2="140" y2="266" stroke="#f97316" stroke-width="8"  stroke-linecap="round" opacity="0.20"/>

  <!-- ── Running figure ────────────────────────────────────────── -->
  <g filter="url(#glow)" fill="none" stroke="url(#fig)" stroke-linecap="round" stroke-linejoin="round">

    <!-- Head -->
    <circle cx="326" cy="100" r="46" fill="url(#fig)" stroke="none"/>

    <!-- Torso (leaning forward ~20°) -->
    <path d="M 312 144 L 272 288" stroke-width="32"/>

    <!-- Front arm — upper arm forward, elbow bent, forearm up -->
    <path d="M 298 186 L 224 228" stroke-width="26"/>
    <path d="M 224 228 L 210 180" stroke-width="24"/>

    <!-- Back arm — swinging behind -->
    <path d="M 298 186 L 376 246" stroke-width="26"/>

    <!-- Front leg — knee raised, stepping forward -->
    <path d="M 272 288 L 208 374" stroke-width="29"/>
    <path d="M 208 374 L 180 448" stroke-width="27"/>

    <!-- Back leg — pushing off, foot leaving ground -->
    <path d="M 272 288 L 350 370" stroke-width="29"/>
    <path d="M 350 370 L 392 436" stroke-width="27"/>

  </g>

  <!-- "PM" badge — bottom-right -->
  <!-- P letter (paths, no font dependency) -->
  <!-- P vertical bar -->
  <rect x="362" y="440" width="14" height="52" rx="6" fill="#f97316" opacity="0.88"/>
  <!-- P bowl (top-right bump) -->
  <path d="M 376 440 Q 416 440 416 462 Q 416 484 376 484"
        stroke="#f97316" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.88"/>

  <!-- M vertical bars and diagonals -->
  <rect x="430" y="440" width="13" height="52" rx="6" fill="#f97316" opacity="0.88"/>
  <rect x="483" y="440" width="13" height="52" rx="6" fill="#f97316" opacity="0.88"/>
  <path d="M 443 440 L 463 470 L 483 440"
        stroke="#f97316" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.88"/>

</svg>
